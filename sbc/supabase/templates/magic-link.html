<h2>Sign in to the SBC website editor</h2>
<p>Tap the button below on your phone to sign in. The link works once.</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;background:#1F5C3E;color:#ffffff;border-radius:10px;text-decoration:none;font-weight:bold">Sign in</a></p>
<p>If the link opens in the wrong app, open the editor page yourself and type this 6-digit code instead:</p>
<p style="font-size:28px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
<p style="color:#666">If you did not ask for this email, you can ignore it.</p>

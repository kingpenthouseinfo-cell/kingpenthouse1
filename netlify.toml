[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /kp -> kp.html (Pretty URLs already does this; explicit rule keeps ?source= intact).
[[redirects]]
  from = "/kp"
  to = "/kp.html"
  status = 200

[[headers]]
  for = "/kp*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.netlify/functions/kp-rsvp"
  [headers.values]
    Cache-Control = "no-store"

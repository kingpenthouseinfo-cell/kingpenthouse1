<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./events.js"></script>
<style>
  html, body { margin:0; padding:0; background:#08070a; color:#EFE6D3; overflow-x:hidden; }
  body { -webkit-font-smoothing:antialiased; scroll-behavior:smooth; }
  a { color:#C9A867; text-decoration:none; }
  a:hover { color:#EFDCAF; }
  @keyframes kpLogo {
    0%   { opacity:.05; letter-spacing:.62em; text-shadow:none; }
    55%  { opacity:.75; }
    100% { opacity:1; letter-spacing:.38em; text-shadow:0 0 46px rgba(201,168,103,.42), 0 0 120px rgba(201,168,103,.16); }
  }
  @keyframes kpVeil { 0% { opacity:.05; } 60% { opacity:.5; } 100% { opacity:.9; } }
  @keyframes kpOut { to { opacity:0; } }
  @keyframes kpRise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes kpTicker { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @keyframes kpAccent { from { opacity:0; } }
</style>
</helmet>

<sc-if value="{{ splash }}" hint-placeholder-val="{{ true }}">
  <div style="position:fixed;inset:0;z-index:90;background:#08070a;display:flex;align-items:center;justify-content:center;animation:kpOut 900ms ease 2400ms forwards;pointer-events:none">
    <div style="position:absolute;width:min(80vw,700px);height:min(80vw,700px);border-radius:50%;background:radial-gradient(circle, rgba(201,168,103,.16), rgba(201,168,103,0) 68%);animation:kpVeil 2600ms ease forwards"></div>
    <div style="position:relative;text-align:center;animation:kpLogo 2600ms cubic-bezier(.22,.61,.36,1) forwards">
      <div style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(30px,8.5vw,64px);color:#F3E7CC;line-height:1">KING</div>
      <div style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(30px,8.5vw,64px);color:#F3E7CC;line-height:1.15">PENTHOUSE</div>
    </div>
  </div>
</sc-if>

<div style="height:100svh;overflow:hidden;background:#08070a;display:flex;flex-direction:column">
  <section style="position:relative;flex:1;min-height:0;overflow:hidden">
    <div style="position:absolute;inset:0">
      <sc-if value="{{ portrait }}" hint-placeholder-val="{{ false }}">
  <img src="./index-hero-mobile.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 30%;filter:brightness(1.1) saturate(1.05);animation:kpAccent 2400ms ease both" />
      </sc-if>
      <sc-if value="{{ landscape }}" hint-placeholder-val="{{ true }}">
  <img src="./index-hero-newloc2.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:brightness(1.1) saturate(1.05);animation:kpAccent 2400ms ease both" />
      </sc-if>
    </div>
    <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(38% 30% at 50% 58%, rgba(8,7,10,.62), rgba(8,7,10,0) 100%), linear-gradient(to bottom, rgba(8,7,10,0) 60%, rgba(8,7,10,.5) 88%, rgba(8,7,10,.75))"></div>
    <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;pointer-events:none;background:rgba(140,195,235,.55);mix-blend-mode:color"></div>
      <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom, rgba(190,225,250,.14), rgba(120,175,220,.1))"></div>
      <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 45%, rgba(225,242,255,0) 55%, rgba(215,236,252,.32) 80%, rgba(240,249,255,.62) 100%)"></div>
      <div style="position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(115deg, rgba(255,255,255,0) 0 38px, rgba(235,247,255,.07) 38px 40px, rgba(255,255,255,0) 40px 90px), repeating-linear-gradient(35deg, rgba(255,255,255,0) 0 60px, rgba(235,247,255,.06) 60px 61px, rgba(255,255,255,0) 61px 130px)"></div>
    </sc-if>
    <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 20px;box-sizing:border-box;gap:clamp(10px,2.2svh,24px)">
      <img src="./el-crown.png" alt="" style="width:clamp(72px,min(15vw,11svh),150px);height:auto;flex:none;animation:kpRise 1600ms cubic-bezier(.22,.61,.36,1) 150ms both" />
      <h1 style="margin:0;animation:kpRise 1400ms cubic-bezier(.22,.61,.36,1) 300ms both;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(30px,min(10vw,8.5svh),96px);line-height:1.04;letter-spacing:.16em;font-weight:400;color:#FFF6E2;text-shadow:0 2px 4px rgba(0,0,0,.9), 0 4px 18px rgba(0,0,0,.85), 0 0 50px rgba(0,0,0,.7)">KING<br>PENTHOUSE</h1>

      
      <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
        <div style="animation:kpRise 1400ms cubic-bezier(.22,.61,.36,1) 800ms both;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 26px;border:1px solid rgba(220,240,255,.55);border-radius:3px;background:linear-gradient(160deg, rgba(20,40,60,.55), rgba(10,22,36,.6));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 40px rgba(160,215,255,.18)">
          <div style="font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:.4em;color:#CDEBFF;text-shadow:0 0 12px rgba(170,220,255,.7)">TEMPORARILY CLOSED</div>
          <div style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(17px,4.4vw,21px);line-height:1.4;color:#EFE6D3;text-wrap:pretty">King Penthouse is closed for a short period while we move. We'll announce our new location soon.</div>
        </div>
      </sc-if>
      <a href="Events.html" style="animation:kpRise 1400ms cubic-bezier(.22,.61,.36,1) 1100ms both;margin-top:clamp(4px,1.5svh,14px);flex:none;min-height:52px;display:flex;align-items:center;justify-content:center;padding:0 42px;border:1px solid rgba(217,188,126,.9);border-radius:2px;background:rgba(8,7,10,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 6px 24px rgba(0,0,0,.6);font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.36em;color:#EBCF92;transition:all 600ms ease" style-hover="border-color:#F3E3BC;color:#F3E3BC;background:rgba(8,7,10,.85);box-shadow:0 0 44px rgba(201,168,103,.22)">EVENTS</a>
      <div style="display:flex;align-items:center;gap:18px;justify-content:center;padding:0 22px;border-radius:999px;background:rgba(8,7,10,.68);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 6px 24px rgba(0,0,0,.55)"><a href="Contact.html" style="animation:kpRise 1400ms cubic-bezier(.22,.61,.36,1) 1400ms both;flex:none;min-height:44px;display:flex;align-items:center;font-family:'Jost',sans-serif;font-weight:400;font-size:10px;letter-spacing:.4em;color:#EFE6D3" style-hover="color:#D9BC7E">CONTACT</a><span style="width:4px;height:4px;border:1px solid rgba(201,168,103,.5);transform:rotate(45deg);flex:none"></span><a href="Location.html" style="animation:kpRise 1400ms cubic-bezier(.22,.61,.36,1) 1550ms both;flex:none;min-height:44px;display:flex;align-items:center;font-family:'Jost',sans-serif;font-weight:400;font-size:10px;letter-spacing:.4em;color:#EFE6D3" style-hover="color:#D9BC7E">LOCATION</a></div>
    </div>
  </section>

  <div style="position:relative;flex:none;overflow:hidden;border-top:1px solid rgba(201,168,103,.2);padding:13px 0;background:rgba(8,7,10,.85)">
    <div style="display:flex;width:max-content;animation:kpTicker 26s linear infinite">
      <div style="display:flex;gap:44px;padding-right:44px;font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:.34em;color:rgba(239,230,211,.55);white-space:nowrap">
        <sc-for list="{{ ticker }}" as="t" hint-placeholder-count="6"><span>{{ t.text }}</span></sc-for>
      </div>
      <div style="display:flex;gap:44px;padding-right:44px;font-family:'Jost',sans-serif;font-weight:300;font-size:11px;letter-spacing:.34em;color:rgba(239,230,211,.55);white-space:nowrap">
        <sc-for list="{{ ticker }}" as="t" hint-placeholder-count="6"><span>{{ t.text }}</span></sc-for>
      </div>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;closed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Status&quot;},&quot;showSplash&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Intro&quot;},&quot;splashSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.6,&quot;min&quot;:1.5,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro&quot;},&quot;replaySplash&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Intro&quot;}}">
class Component extends DCLogic {
  state = { splash: true, tick: 0, portrait: typeof window !== "undefined" && window.innerWidth / window.innerHeight < 0.85 };
  componentDidMount() {
    this.onResize = () => this.setState({ portrait: window.innerWidth / window.innerHeight < 0.85 });
    window.addEventListener("resize", this.onResize);
    if (!window.KP_EVENTS) this.poll = setInterval(() => {
      if (window.KP_EVENTS) { clearInterval(this.poll); this.setState({ tick: 1 }); }
    }, 60);
    const seen = (() => { try { return sessionStorage.getItem("kp-splash-seen"); } catch (e) { return null; } })();
    if (this.props.showSplash === false || (seen && this.props.replaySplash !== true)) {
      this.setState({ splash: false });
      return;
    }
    const ms = (this.props.splashSeconds ?? 2.6) * 1000 + 900;
    this.timer = setTimeout(() => {
      try { sessionStorage.setItem("kp-splash-seen", "1"); } catch (e) {}
      this.setState({ splash: false });
    }, ms);
  }
  componentWillUnmount() { clearTimeout(this.timer); clearInterval(this.poll); window.removeEventListener("resize", this.onResize); }
  renderVals() {
    const closed = this.props.closed ?? false;
    const portrait = !!this.state.portrait;
    const list = (window.KP_EVENTS || [])
      .filter(e => (e.status ?? "active") === "active")
      .filter(e => { const t = Date.parse(e.date + "T23:59:59"); const now = new Date(); now.setHours(now.getHours() - 6); return !t || t >= now; })
      .sort((a, b) => (Date.parse(a.date) || Infinity) - (Date.parse(b.date) || Infinity));
    return {
      splash: this.state.splash,
      closed,
      portrait,
      landscape: !portrait,
      ticker: closed
        ? [1,2,3].map(() => ({ text: "KING PENTHOUSE IS TEMPORARILY CLOSED   ❄   NEW LOCATION ANNOUNCED SOON   ❄" }))
        : list.map(e => ({
        text: `${e.name} — ${(e.dateLabel || "").replace(/^\w+, /, "").replace(/, \d{4}$/, "")}   ✦`
      }))
    };
  }
}

</script>
</body>
</html>

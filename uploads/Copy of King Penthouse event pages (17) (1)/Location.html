<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  state = { p: 0, narrow: typeof window !== "undefined" && window.innerWidth < 760 };
  componentDidMount() {
    this.onScroll = () => {
      if (this.raf) return;
      this.raf = requestAnimationFrame(() => {
        this.raf = null;
        const vh = window.innerHeight || 1;
        this.setState({ p: window.scrollY / vh, narrow: window.innerWidth < 760 });
      });
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    window.addEventListener("resize", this.onScroll);
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("resize", this.onScroll);
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const p = this.state.p || 0;
    const N = 6;
    const layer = i => {
      const d = p - i;
      const a = Math.max(0, 1 - Math.abs(d) * 1.25);
      const eased = a * a * (3 - 2 * a);
      return `position:absolute;inset:0;overflow:hidden;opacity:${eased.toFixed(3)};transform:translate3d(0,${(d * -5).toFixed(2)}%,0) scale(${(1 + Math.abs(d) * 0.035).toFixed(3)});transition:opacity 260ms linear;will-change:opacity,transform`;
    };
    const cap = i => {
      const d = p - i;
      const a = Math.max(0, Math.min(1, 1 - (Math.abs(d) - 0.12) * 2.2));
      return `width:100%;opacity:${a.toFixed(3)};transform:translate3d(0,${(d * 26).toFixed(1)}px,0);transition:opacity 220ms linear;will-change:opacity,transform`;
    };
    const nums = ["I", "II", "III", "IV", "V", "VI", "VII"];
    const ids = ["i", "ii", "iii", "iv", "v", "vi", "vii"];
    const active = Math.max(0, Math.min(6, Math.round(p)));
    const narrow = this.state.narrow;
    const out = {
      imgStyle: narrow
        ? "width:100%;height:100%;object-fit:contain;object-position:center 42%;background:#050406;filter:brightness(.72) contrast(1.06) saturate(1.02)"
        : "width:100%;height:100%;object-fit:cover;filter:brightness(.74) contrast(1.06) saturate(1.02);animation:lDrift 26000ms ease-out both",
      railWrap: narrow
        ? "position:fixed;z-index:60;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:0;padding:0 6px;border-radius:999px;border:1px solid rgba(201,168,103,.2);background:rgba(6,5,8,.55);backdrop-filter:blur(6px);animation:lFade 1800ms ease 900ms both"
        : "position:fixed;z-index:60;right:clamp(16px,2.6vw,34px);top:50%;transform:translateY(-50%);display:grid;gap:clamp(10px,1.4svh,18px);justify-items:end;animation:lFade 1800ms ease 900ms both",
      rail: nums.map((num, i) => ({
        num: narrow ? "" : num,
        href: "#" + ids[i],
        style: narrow
          ? "min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;flex:none"
          : `font-family:'Cormorant Garamond',serif;font-size:${i === active ? 15 : 12}px;letter-spacing:.16em;line-height:1;padding:5px 4px;color:${i === active ? "#F1E0B8" : "rgba(201,168,103,.4)"};border-right:1px solid ${i === active ? "rgba(201,168,103,.95)" : "rgba(201,168,103,0)"};padding-right:10px;transition:all 420ms ease`,
        dot: narrow
          ? `display:block;width:${i === active ? 16 : 5}px;height:5px;border-radius:999px;background:${i === active ? "rgba(241,224,184,.95)" : "rgba(201,168,103,.35)"};transition:all 420ms ease`
          : "display:inline"
      }))
    };
    for (let i = 0; i < N; i++) { out["s" + i] = layer(i); out["c" + i] = cap(i); }
    return out;
  }
}

</script>
